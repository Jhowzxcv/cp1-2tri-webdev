<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #12100E; font-family: Archivo, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #E8A33D; text-decoration: none; }
    a:hover { color: #F2BE86; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="display: flex; flex-direction: column; width: 390px; height: 844px; background: #12100E; color: #F5F1EA; overflow: hidden;">

  <header style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 20px; border-bottom: 1px solid #2E2924; flex-shrink: 0;">
    <div style="display: flex; align-items: baseline; gap: 3px;">
      <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 21px; color: #F5F1EA;">Cliff</span>
      <span style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 21px; color: #E8A33D;">hanger</span>
    </div>
    <div style="flex-grow: 1;"></div>
    <span style="font-size: 12px; color: #6E665C;">12 séries</span>
  </header>

  <div style="display: flex; flex-direction: column; flex-grow: 1; min-height: 0; padding: 22px 20px 0; overflow: hidden;">

    <div style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px;">
      <h1 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-size: 32px; font-weight: 400; line-height: 1.08; letter-spacing: -0.2px;">Continue de onde parou</h1>
      <p style="margin: 0; font-size: 13.5px; color: #A39B8F;">4 séries esperando por você.</p>
    </div>

    <div style="display: flex; gap: 8px; margin-bottom: 18px; flex-shrink: 0;">
      <span style="padding: 8px 13px; border-radius: 100px; background: #221E1A; border: 1px solid #3C352D; font-size: 13px; color: #F5F1EA; white-space: nowrap;">Em andamento</span>
      <span style="padding: 8px 13px; border-radius: 100px; border: 1px solid #2E2924; font-size: 13px; color: #A39B8F; white-space: nowrap;">Em dia</span>
      <span style="padding: 8px 13px; border-radius: 100px; border: 1px solid #2E2924; font-size: 13px; color: #A39B8F; white-space: nowrap;">Todas</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px;">

      <article style="display: flex; gap: 14px; padding: 14px; background: #1A1714; border: 1px solid #2E2924; border-radius: 6px;">
        <div style="display: flex; align-items: center; justify-content: center; width: 74px; height: 111px; flex-shrink: 0; border-radius: 4px; background: #2A2119;">
          <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 42px; line-height: 1; color: #F5F1EA; opacity: 0.14;">S</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px; flex-grow: 1; min-width: 0;">
          <span style="font-size: 15.5px; font-weight: 600;">Severance</span>
          <div style="display: flex; align-items: baseline; gap: 8px; min-width: 0;">
            <span style="padding: 3px 6px; border-radius: 3px; background: rgba(232,163,61,0.14); color: #E8A33D; font-size: 11.5px; font-weight: 600;">T2E5</span>
            <span style="font-size: 13.5px; color: #D6CFC4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">O corredor sem fim</span>
          </div>
          <div style="display: flex; align-items: center; gap: 9px;">
            <div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #2E2924; overflow: hidden;">
              <div style="width: 37%; height: 100%; background: #E8A33D;"></div>
            </div>
            <span style="font-size: 11.5px; color: #6E665C; white-space: nowrap;">14/38</span>
          </div>
          <button style="display: flex; align-items: center; justify-content: center; gap: 7px; height: 44px; margin-top: 2px; background: transparent; border: 1px solid #3C352D; border-radius: 5px; color: #F5F1EA; font-family: Archivo, system-ui, sans-serif; font-size: 13.5px; font-weight: 500; cursor: pointer;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/></svg>
            Marcar como visto
          </button>
        </div>
      </article>

      <article style="display: flex; gap: 14px; padding: 14px; background: #1A1714; border: 1px solid #2E2924; border-radius: 6px;">
        <div style="display: flex; align-items: center; justify-content: center; width: 74px; height: 111px; flex-shrink: 0; border-radius: 4px; background: #2B1E1B;">
          <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 42px; line-height: 1; color: #F5F1EA; opacity: 0.14;">B</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px; flex-grow: 1; min-width: 0;">
          <span style="font-size: 15.5px; font-weight: 600;">The Bear</span>
          <div style="display: flex; align-items: baseline; gap: 8px; min-width: 0;">
            <span style="padding: 3px 6px; border-radius: 3px; background: rgba(232,163,61,0.14); color: #E8A33D; font-size: 11.5px; font-weight: 600;">T3E2</span>
            <span style="font-size: 13.5px; color: #D6CFC4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Noite de serviço</span>
          </div>
          <div style="display: flex; align-items: center; gap: 9px;">
            <div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #2E2924; overflow: hidden;">
              <div style="width: 66%; height: 100%; background: #E8A33D;"></div>
            </div>
            <span style="font-size: 11.5px; color: #6E665C; white-space: nowrap;">19/28</span>
          </div>
          <button style="display: flex; align-items: center; justify-content: center; gap: 7px; height: 44px; margin-top: 2px; background: transparent; border: 1px solid #3C352D; border-radius: 5px; color: #F5F1EA; font-family: Archivo, system-ui, sans-serif; font-size: 13.5px; font-weight: 500; cursor: pointer;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/></svg>
            Marcar como visto
          </button>
        </div>
      </article>

      <article style="display: flex; gap: 14px; padding: 14px; background: #1A1714; border: 1px solid #2E2924; border-radius: 6px;">
        <div style="display: flex; align-items: center; justify-content: center; width: 74px; height: 111px; flex-shrink: 0; border-radius: 4px; background: #1F2620;">
          <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 42px; line-height: 1; color: #F5F1EA; opacity: 0.14;">A</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px; flex-grow: 1; min-width: 0;">
          <span style="font-size: 15.5px; font-weight: 600;">Andor</span>
          <div style="display: flex; align-items: baseline; gap: 8px; min-width: 0;">
            <span style="padding: 3px 6px; border-radius: 3px; background: rgba(232,163,61,0.14); color: #E8A33D; font-size: 11.5px; font-weight: 600;">T1E9</span>
            <span style="font-size: 13.5px; color: #D6CFC4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Nada além do trabalho</span>
          </div>
          <div style="display: flex; align-items: center; gap: 9px;">
            <div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #2E2924; overflow: hidden;">
              <div style="width: 33%; height: 100%; background: #E8A33D;"></div>
            </div>
            <span style="font-size: 11.5px; color: #6E665C; white-space: nowrap;">8/24</span>
          </div>
          <button style="display: flex; align-items: center; justify-content: center; gap: 7px; height: 44px; margin-top: 2px; background: transparent; border: 1px solid #3C352D; border-radius: 5px; color: #F5F1EA; font-family: Archivo, system-ui, sans-serif; font-size: 13.5px; font-weight: 500; cursor: pointer;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/></svg>
            Marcar como visto
          </button>
        </div>
      </article>

    </div>
  </div>

  <nav style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); height: 68px; border-top: 1px solid #2E2924; background: #16130F; flex-shrink: 0;">
    <span style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: #E8A33D; font-size: 11px; font-weight: 500;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/></svg>
      Minhas séries
    </span>
    <span style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: #6E665C; font-size: 11px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      Buscar
    </span>
    <span style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: #6E665C; font-size: 11px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-7"/></svg>
      Estatísticas
    </span>
  </nav>
</div>
</x-dc>
</body>
</html>
